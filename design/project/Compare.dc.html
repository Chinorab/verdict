<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare day 0 and day 26</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7E9E5}
*{box-sizing:border-box}
a{color:#2B45C4}a:hover{color:#1C2F8F}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2B45C4;outline-offset:2px}
.num{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:ew-resize;touch-action:manipulation}
.range::-webkit-slider-runnable-track{height:1px;background:#141716}
.range::-moz-range-track{height:1px;background:#141716}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-10px;background:#141716;border:0;border-radius:0}
.range::-moz-range-thumb{width:20px;height:20px;background:#141716;border:0;border-radius:0}
.tab{transition:background-color .2s ease,color .2s ease}
@keyframes ring{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:none}}
.ring{animation:ring .4s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){.ring{animation:none}.tab{transition:none}}
</style>
</helmet>
<main style="width: 390px; min-height: 1040px; background: #F3F4F1; color: #141716; font-family: 'Hanken Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 0 24px 28px">
<header style="height: 64px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border-bottom: 1px solid #D3D7D2">
<a href="Timeline.dc.html" aria-label="Back to timeline" style="width: 44px; height: 44px; display: flex; align-items: center; color: #141716"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12.5 4l-6 6 6 6"></path></svg></a>
<span style="text-align: center; font-size: 15px; font-weight: 500">Compare</span>
<span></span>
</header>
<div role="group" aria-label="What to compare" style="margin-top: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #141716">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="tab" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<p class="num" style="margin: 14px 0 10px; font-size: 12px; color: #5F6662">Left cheek. Light matched within 3%, angle within 2°.</p>
<div role="img" aria-label="Skin photo, day 0 on the left of the slider, day 26 on the right" style="position: relative; height: 380px; overflow: hidden; background: radial-gradient(130% 100% at 35% 25%, #D8B39A 0%, #C99D82 55%, #B88B70 100%)">
<sc-for list="{{spots26}}" as="s" hint-placeholder-count="13"><span style="{{s.dot}}"></span></sc-for>
<sc-if value="{{ringsOn}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{spots26}}" as="s" hint-placeholder-count="13"><span class="ring" style="{{s.ring}}"></span></sc-for>
</sc-if>
<sc-if value="{{regionOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 40px; top: 50px; right: 40px; bottom: 70px; border: 1.5px dashed #1F3BC7; background: rgba(43,69,196,0.08)"></div>
</sc-if>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pos}}%; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; width: 342px; height: 380px; background: radial-gradient(130% 100% at 35% 25%, #D6AF95 0%, #C69A7E 55%, #B6886C 100%)">
<sc-for list="{{spots0}}" as="s" hint-placeholder-count="14"><span style="{{s.dot}}"></span></sc-for>
<sc-if value="{{ringsOn}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{spots0}}" as="s" hint-placeholder-count="14"><span class="ring" style="{{s.ring}}"></span></sc-for>
</sc-if>
<sc-if value="{{regionOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 40px; top: 50px; right: 40px; bottom: 70px; border: 1.5px dashed #1F3BC7; background: rgba(43,69,196,0.08)"></div>
</sc-if>
</div>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: calc({{pos}}% - 1px); width: 2px; background: #F3F4F1"></div>
<div aria-hidden="true" style="position: absolute; top: 168px; left: calc({{pos}}% - 16px); width: 32px; height: 44px; background: #F3F4F1; display: flex; align-items: center; justify-content: center; color: #141716"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 5l-4 5 4 5M13 5l4 5-4 5"></path></svg></div>
</div>
<div class="num" style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #4D5450"><span>Day 0, Oct 12</span><span>Day 26, Nov 7</span></div>
<label for="slider" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Slide between day 0 and day 26</label>
<input id="slider" class="range" type="range" min="0" max="100" value="{{pos}}" onChange="{{onRange}}">
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-top: 1px solid #D3D7D2; border-bottom: 1px solid #D3D7D2; font-size: 15px; cursor: pointer">
<span>Detection overlay</span>
<span style="display: flex; align-items: center; gap: 10px">
<span class="num" style="font-size: 12px; color: #5F6662">{{overlayLabel}}</span>
<input type="checkbox" checked="{{overlay}}" onChange="{{onToggle}}" style="width: 22px; height: 22px; accent-color: #141716; margin: 0">
</span>
</label>
<section aria-live="polite" aria-label="Measured values" style="padding-top: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 500">{{cur.metric}}</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid #141716">
<div style="padding: 12px 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5F6662">Day 0</span><span class="num" style="font-size: 22px">{{cur.d0}}</span></div>
<div style="padding: 12px 0 12px 12px; border-left: 1px solid #D3D7D2; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5F6662">Day 26</span><span class="num" style="font-size: 22px">{{cur.d26}}</span></div>
<div style="padding: 12px 0 12px 12px; border-left: 1px solid #D3D7D2; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5F6662">Change</span><span class="num" style="font-size: 22px">{{cur.change}}</span></div>
</div>
<p class="num" style="margin: 0; font-size: 13px; color: #4D5450">Your noise: {{cur.noise}}</p>
</section>
<a href="Verdict.dc.html" style="margin-top: 24px; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500">See the verdict<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3.5 10h12.5M11 5l5 5-5 5"></path></svg></a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pos = st.pos == null ? 50 : st.pos;
    const overlay = st.overlay == null ? true : st.overlay;
    const tab = st.tab || 'spots';
    const pts = [[60,80,9],[92,64,7],[130,98,11],[176,72,8],[214,118,9],[248,90,7],[84,150,10],[150,170,8],[196,206,12],[262,180,9],[110,250,8],[170,270,10],[230,262,7],[286,236,8]];
    const mk = (alpha) => ([x, y, s]) => ({
      dot: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + s + 'px; height: ' + Math.round(s * 0.8) + 'px; border-radius: 50%; background: rgba(112,66,44,' + alpha + '); filter: blur(0.8px)',
      ring: 'position: absolute; left: ' + (x - 6) + 'px; top: ' + (y - 6) + 'px; width: ' + (s + 12) + 'px; height: ' + (s + 12) + 'px; border-radius: 50%; border: 1.5px solid #1F3BC7; background: rgba(43,69,196,0.10)'
    });
    const spots0 = pts.map(mk(0.5));
    const spots26 = pts.filter((p, i) => i !== 5).map(mk(0.46));
    const data = {
      spots: { label: 'Spots', metric: 'Dark spot area', d0: '4.8%', d26: '4.7%', change: '−2.1%', noise: '±3.4%' },
      red: { label: 'Redness', metric: 'Redness index', d0: '21.4', d26: '21.6', change: '+1.1%', noise: '±2.8%' },
      tex: { label: 'Texture', metric: 'Roughness', d0: '3.10', d26: '3.33', change: '+7.4%', noise: '±4.0%' },
      glow: { label: 'Glow', metric: 'Brightness evenness', d0: '0.68', d26: '0.72', change: '+5.9%', noise: '±2.2%' }
    };
    const base = 'height: 44px; border: 0; font-family: inherit; font-size: 14px; cursor: pointer; ';
    const tabs = Object.keys(data).map((k, i) => ({
      label: data[k].label,
      pressed: k === tab ? 'true' : 'false',
      pick: () => this.setState({ tab: k }),
      style: base + (i > 0 ? 'border-left: 1px solid #141716; ' : '') + (k === tab ? 'background: #141716; color: #F3F4F1;' : 'background: transparent; color: #141716;')
    }));
    return {
      pos, overlay, tabs, spots0, spots26,
      cur: data[tab],
      ringsOn: overlay && tab === 'spots',
      regionOn: overlay && tab !== 'spots',
      overlayLabel: overlay ? 'On' : 'Off',
      onRange: (e) => this.setState({ pos: Number(e.target.value) }),
      onToggle: (e) => this.setState({ overlay: e.target.checked })
    };
  }
}
</script>
</body>
</html>
