<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guided capture, day 0</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7E9E5}
*{box-sizing:border-box}
a{color:#9DB0FF}a:hover{color:#C3CEFF}
a:focus-visible,button:focus-visible{outline:2px solid #9DB0FF;outline-offset:2px}
.num{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
.nudge{animation:nudge 1.6s ease-in-out infinite}
.shutter{transition:transform .15s ease}
.shutter:active{transform:scale(.95)}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.flash{animation:flash .5s ease-out both}
@media (prefers-reduced-motion:reduce){.breathe,.nudge,.flash{animation:none}.flash{opacity:0}.shutter{transition:none}}
</style>
</helmet>
<main style="width: 390px; height: 844px; background: #111413; color: #F3F4F1; font-family: 'Hanken Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 0 24px">
<header style="height: 64px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center">
<a href="Claims.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; display: flex; align-items: center; color: #F3F4F1"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"></path></svg></a>
<span class="num" style="text-align: center; font-size: 13px; color: #C9CECA">Day 0, photo {{shotLabel}} of 2</span>
<button type="button" aria-label="How capture works" style="width: 44px; height: 44px; background: none; border: 0; color: #F3F4F1; display: flex; align-items: center; justify-content: flex-end; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="7.5"></circle><path d="M8 8a2 2 0 1 1 2.5 1.9c-.4.1-.5.4-.5.8v.8M10 13.6v.1"></path></svg></button>
</header>
<ul aria-live="polite" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #2E3331; border-bottom: 1px solid #2E3331">
<li style="padding: 12px 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A9AFAB"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="3.5"></circle><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"></path></svg>Light</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9DB0FF"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 10.5l4 4 8-9"></path></svg>Even</span>
</li>
<li style="padding: 12px 0 12px 12px; border-left: 1px solid #2E3331; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A9AFAB"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"></path></svg>Framing</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9DB0FF"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 10.5l4 4 8-9"></path></svg>Centered</span>
</li>
<li style="padding: 12px 0 12px 12px; border-left: 1px solid #2E3331; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A9AFAB"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="9" r="6"></circle><path d="M10 15v3"></path></svg>Angle</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #F2A766"><svg class="nudge" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12.5 4l-6 6 6 6"></path></svg>Turn left a little</span>
</li>
</ul>
<div role="img" aria-label="Live front camera with a face outline guide" style="margin-top: 16px; position: relative; height: 420px; background: radial-gradient(70% 60% at 50% 45%, #2A2F2D 0%, #1A1D1C 70%, #151817 100%); overflow: hidden; display: flex; align-items: center; justify-content: center">
<div class="breathe" style="width: 220px; height: 296px; border: 2px dashed #F2A766; border-radius: 50%"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 176px; display: flex; justify-content: space-between; padding: 0 12px">
<span style="width: 18px; height: 1px; background: #6F7672; display: block"></span>
<span style="width: 18px; height: 1px; background: #6F7672; display: block"></span>
</div>
<span class="num" aria-hidden="true" style="position: absolute; left: 12px; top: 184px; font-size: 10px; color: #8D9490">eye line</span>
<sc-if value="{{flash}}" hint-placeholder-val="{{ false }}">
<div class="flash" aria-hidden="true" style="position: absolute; inset: 0; background: #F3F4F1"></div>
</sc-if>
</div>
<ul style="list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9CECA"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="M5 15L15 5"></path></svg>No makeup</li>
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9CECA"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 17V8l7-5 7 5v9z"></path><path d="M8 17v-5h4v5"></path></svg>Same room</li>
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9CECA"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="M10 6v4l2.5 1.5"></path></svg>Same hour</li>
</ul>
<p style="margin: 14px 0 0; font-size: 13px; line-height: 1.5; color: #A9AFAB">Two photos today show how much a reading moves on its own. That sets your noise floor.</p>
<div style="margin-top: auto; padding-bottom: 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
<span class="num" style="font-size: 13px; color: #C9CECA">{{shots}}/2 taken</span>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a href="Timeline.dc.html" style="height: 56px; padding: 0 18px; background: #F3F4F1; color: #111413; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">Baseline set<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3.5 10h12.5M11 5l5 5-5 5"></path></svg></a>
</sc-if>
<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<button type="button" class="shutter" aria-label="Take photo" onClick="{{shoot}}" style="width: 76px; height: 76px; border: 2px solid #F3F4F1; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><span style="width: 60px; height: 60px; background: #F3F4F1; display: block"></span></button>
</sc-if>
<span></span>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const shots = (this.state && this.state.shots) || 0;
    const done = shots >= 2;
    return {
      shots,
      shotLabel: String(Math.min(shots + 1, 2)),
      done,
      notDone: !done,
      flash: !!(this.state && this.state.flash),
      shoot: () => {
        this.setState({ shots: shots + 1, flash: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ flash: false }), 500);
      }
    };
  }
  componentWillUnmount() { clearTimeout(this._t); }
}
</script>
</body>
</html>
