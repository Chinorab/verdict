<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New trial, scan the label</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7E9E5}
*{box-sizing:border-box}
a{color:#2B45C4}a:hover{color:#1C2F8F}
a:focus-visible,button:focus-visible{outline:2px solid #2B45C4;outline-offset:2px}
.num{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
@keyframes sweep{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(300px);opacity:0}}
.sweep{animation:sweep 2.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes found{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.found{animation:found .45s cubic-bezier(.16,1,.3,1) both}
.f2{animation-delay:.5s}.f3{animation-delay:.9s}.f4{animation-delay:1.3s}.f5{animation-delay:1.7s}
.shutter{transition:transform .15s ease}
.shutter:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.sweep{animation:none;opacity:0}.found{animation:none}.shutter{transition:none}}
</style>
</helmet>
<main style="width: 390px; height: 844px; background: #F3F4F1; color: #141716; font-family: 'Hanken Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 0 24px">
<header style="height: 64px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border-bottom: 1px solid #D3D7D2">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #141716"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12.5 4l-6 6 6 6"></path></svg></a>
<span style="text-align: center; font-size: 15px; font-weight: 500">New trial</span>
<span class="num" style="font-size: 12px; color: #5F6662; text-align: right">1/3</span>
</header>
<section style="padding: 28px 0 20px; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 400; letter-spacing: -0.5px">Photograph the claims</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4D5450">Front or back of the pack, wherever the promises are printed.</p>
</section>
<div role="img" aria-label="Camera view of a serum box with four claims outlined" style="position: relative; height: 380px; background: #1B1E1D; overflow: hidden; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; left: 20px; top: 20px; width: 28px; height: 28px; border-left: 2px solid #F3F4F1; border-top: 2px solid #F3F4F1"></div>
<div style="position: absolute; right: 20px; top: 20px; width: 28px; height: 28px; border-right: 2px solid #F3F4F1; border-top: 2px solid #F3F4F1"></div>
<div style="position: absolute; left: 20px; bottom: 20px; width: 28px; height: 28px; border-left: 2px solid #F3F4F1; border-bottom: 2px solid #F3F4F1"></div>
<div style="position: absolute; right: 20px; bottom: 20px; width: 28px; height: 28px; border-right: 2px solid #F3F4F1; border-bottom: 2px solid #F3F4F1"></div>
<div style="width: 196px; height: 300px; background: #E4E6E1; padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; transform: rotate(-2deg); position: relative">
<span style="font-size: 9px; letter-spacing: 1.6px; color: #4D5450">FACE SERUM</span>
<span style="font-size: 18px; line-height: 1.1; font-weight: 600; color: #141716">Brightening Serum</span>
<div class="found" style="border: 1.5px solid #2B45C4; padding: 5px 6px; font-size: 11px; line-height: 1.3; color: #141716; background: rgba(43,69,196,0.08)">Fades dark spots in 4 weeks</div>
<div class="found f2" style="border: 1.5px solid #2B45C4; padding: 5px 6px; font-size: 11px; line-height: 1.3; color: #141716; background: rgba(43,69,196,0.08)">Visibly reduces redness</div>
<div class="found f3" style="border: 1.5px solid #2B45C4; padding: 5px 6px; font-size: 11px; line-height: 1.3; color: #141716; background: rgba(43,69,196,0.08)">Smoother skin texture</div>
<div class="found f4" style="border: 1.5px solid #2B45C4; padding: 5px 6px; font-size: 11px; line-height: 1.3; color: #141716; background: rgba(43,69,196,0.08)">Radiant glow</div>
<div class="found f5" style="border: 1.5px dashed #6B716D; padding: 5px 6px; font-size: 11px; line-height: 1.3; color: #4D5450">72 hour hydration</div>
<span class="num" style="margin-top: auto; font-size: 10px; color: #4D5450">30 ml / 1 fl oz</span>
</div>
<div class="sweep" aria-hidden="true" style="position: absolute; left: 48px; right: 48px; top: 40px; height: 1px; background: #7C93FF"></div>
</div>
<p aria-live="polite" style="margin: 14px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#2B45C4" stroke-width="1.75" aria-hidden="true"><path d="M4 10.5l4 4 8-9"></path></svg>
<span>5 claims read, 4 can be measured</span>
</p>
<div style="margin-top: auto; padding-bottom: 32px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
<button type="button" style="justify-self: start; min-height: 44px; padding: 0; background: none; border: 0; font: inherit; font-size: 14px; color: #141716; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="14" height="12"></rect><path d="M3 13l4-4 3 3 2-2 5 5"></path><circle cx="13" cy="7.5" r="1"></circle></svg>
Upload
</button>
<a class="shutter" href="Claims.dc.html" aria-label="Take photo of the label" style="width: 76px; height: 76px; border: 2px solid #141716; display: flex; align-items: center; justify-content: center">
<span style="width: 60px; height: 60px; background: #141716; display: block"></span>
</a>
<a href="Claims.dc.html" style="justify-self: end; min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #141716">Type them</a>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
